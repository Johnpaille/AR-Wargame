<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Wargame AR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#111111">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<style>
  :root { --bg: #111; --fg: #f2f2f2; --btn: rgba(30,30,30,.85); --on: #3fa9f5; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px system-ui, sans-serif; }
  #start { padding: 24px 16px; text-align: center; }
  #start button { font-size: 20px; padding: 14px 28px; }
  #ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
  #ui[hidden] { display: none; }
  #bb { margin: -6px 12px 0; padding: 4px 10px; background: var(--btn); border-radius: 8px; text-align: center; font-size: 13px; }
  #bb[hidden] { display: none; }
  #status { pointer-events: auto; margin: 12px; padding: 8px 12px; background: var(--btn); border-radius: 8px; text-align: center; }
  #panel { pointer-events: auto; padding: 6px; display: grid; gap: 4px; font-size: 14px; }
  #panel.folded > .row:not(#modes) { display: none; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; justify-content: center; }
  .row[hidden], #sheet[hidden] { display: none; }
  button, select, input { font: inherit; color: var(--fg); background: var(--btn); border: 1px solid #555; border-radius: 8px; padding: 6px 8px; }
  input { width: 2.6em; padding: 4px; }
  input.name { width: 9em; }
  #modes { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; }
  #modes button { flex: none; }
  button.on { background: var(--on); border-color: var(--on); color: #000; }
  label { background: var(--btn); padding: 2px 6px; border-radius: 8px; }
  #unitName { font-weight: bold; }
  #checklist { max-height: 45vh; overflow-y: auto; padding: 6px; background: rgba(0,0,0,.85); border-radius: 10px; }
  #checklist[hidden] { display: none; }
  #checklist label { display: block; background: none; padding: 4px 0; }
  #checklist input { width: auto; margin-right: 6px; }
  #checklist textarea { width: 100%; box-sizing: border-box; font: inherit; color: var(--fg); background: var(--btn); border: 1px solid #555; border-radius: 8px; }
  #army { max-height: 45vh; overflow-y: auto; padding: 6px; background: rgba(0,0,0,.85); border-radius: 10px; display: grid; gap: 6px; }
  #army[hidden] { display: none; }
  #losAsk { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; align-items: center; padding: 6px; background: rgba(0,0,0,.85); border: 1px solid #ff9500; border-radius: 10px; }
  #losAsk[hidden] { display: none; }
  #army input[type=file] { width: 100%; }
  #army textarea { width: 100%; box-sizing: border-box; font: inherit; color: var(--fg); background: var(--btn); border: 1px solid #555; border-radius: 8px; }
  #profileInfo { white-space: pre-line; font-size: 12px; max-height: 30vh; overflow-y: auto; }
  #profileInfo:empty { display: none; }
  #sheet { display: grid; gap: 4px; padding: 6px; background: rgba(0,0,0,.8); border-radius: 10px; }
</style>
</head>
<body>
<div id="start">
  <h1>Wargame AR</h1>
  <p id="support">Vérification ARCore…</p>
  <button id="enter" disabled>Démarrer AR</button>
  <p><label><input id="occl" type="checkbox" style="width:auto"> Occlusion par la profondeur (expérimental)</label></p>
  <p>Calibre avec une règle, pose 2 repères sur la table, puis les figurines.</p>
  <p id="saved" hidden>Une partie est sauvegardée : en AR, mode Repères sur les 2 mêmes points pour la reprendre.
    <button id="forget">Nouvelle partie</button></p>
</div>
<div id="ui" hidden>
  <div id="status">Touche la table.</div>
  <!-- BattleBase live score (read-only), filled from the link in the Liste panel -->
  <div id="bb" hidden></div>
  <div id="panel">
    <!-- on-device test checklist, opened by the Tests button; ticks and notes stay in localStorage -->
    <div id="checklist" hidden>
      <div id="checkItems"></div>
      <textarea id="checkNotes" rows="3" placeholder="Notes (ce qui ne marche pas, écarts mesurés…)"></textarea>
      <div class="row">
        <button id="checkCopy">Copier le rapport</button>
        <button id="checkReset">Tout décocher</button>
        <button id="checkClose">Fermer</button>
      </div>
    </div>
    <!-- Tirer: one of the models is within an obscuring area, the player checks the real line of sight -->
    <div id="losAsk" hidden>
      <span>La cible dépasse ?</span>
      <button data-los="full">Entièrement visible</button>
      <button data-los="partial">En partie (couvert)</button>
      <button data-los="none">Cachée</button>
    </div>
    <!-- army list import (BattleBase PDF or pasted text), one list per player -->
    <div id="army" hidden>
      <input id="armyFile" type="file" accept=".pdf,.txt,application/pdf,text/plain" aria-label="Fichier de liste (PDF BattleBase)">
      <textarea id="armyText" rows="3" placeholder="…ou colle ici le texte de la liste"></textarea>
      <div class="row">
        <button id="armyImport">Importer pour le camp choisi</button>
        <button id="armyClose">Fermer</button>
      </div>
      <div id="armySummary"></div>
      <div class="row">
        <input id="bbLink" class="name" placeholder="Lien de partie BattleBase" aria-label="Lien de partie BattleBase">
        <button id="bbFollow">Suivre</button>
      </div>
    </div>
    <!-- unit sheet, opened by tapping the unit name -->
    <div id="sheet" hidden>
      <div class="row">
        <input id="uName" class="name" aria-label="Nom de l'unité">
        <select id="uType" aria-label="Type d'unité">
          <option value="inf">Infanterie/Bête/Nuée</option>
          <option value="other">Véhicule/Monstre/autre</option>
        </select>
      </div>
      <div class="row">
        <label>M <input id="move" type="number" value="6" min="0" step="1">"</label>
        <label>OC <input id="oc" type="number" value="2" min="0" step="1"></label>
        <label>Ld <input id="ld" type="number" value="7" min="2" max="12" step="1">+</label>
        <label>PV <input id="w" type="number" value="1" min="1" step="1"></label>
      </div>
      <div id="profileInfo"></div>
      <div id="weapons"></div>
      <div class="row">
        <button id="addWeapon">+ Arme</button>
        <button id="closeSheet">OK</button>
      </div>
    </div>
    <div class="row">
      <select id="side" aria-label="Camp"><option value="1">J1</option><option value="2">J2</option></select>
      <button id="newUnit">+ Unité</button>
      <button id="unitName">–</button>
      <select id="weapon" aria-label="Arme"></select>
      <select id="listUnit" hidden aria-label="Lier une unité de la liste d'armée"></select>
    </div>
    <div class="row">
      <label>Socle <select id="base"></select></label>
      <label id="calibLabel" hidden>Règle <input id="calibLen" type="number" value="6" min="1">"</label>
      <span id="terrainOpts" hidden>
        <select id="tType" aria-label="Type de décor">
          <option value="dense">Dense</option>
          <option value="light">Léger</option>
          <option value="exposed">Exposé</option>
        </select>
        <label>H <input id="tH" type="number" value="5" min="0">"</label>
      </span>
      <select id="objAct" hidden aria-label="Action objectif">
        <option value="place">Poser / retirer</option>
        <option value="secure">Sécuriser</option>
      </select>
      <label id="dmgLabel" hidden>Dégâts <input id="dmg" type="number" value="1" min="1" step="1"></label>
      <button id="advance">Avance D6</button>
      <button id="charge">Charge 2D6</button>
      <button id="undoAct" aria-label="Annuler la dernière action">↶ Annuler</button>
      <button id="undo">Retirer fig.</button>
      <button id="clear">Effacer traits</button>
    </div>
    <div class="row">
      <button id="phase">T1 J1 · Commandement ›</button>
      <button id="morale">Moral 2D6</button>
    </div>
    <div class="row" id="modes">
      <button id="fold" aria-label="Replier les outils">▾</button>
      <button data-mode="place" class="on">Poser</button>
      <button data-mode="group">Grouper</button>
      <button data-mode="measure">Mesurer</button>
      <button data-mode="move">Déplacer</button>
      <button data-mode="shoot">Tirer</button>
      <button data-mode="wound">Blesser</button>
      <button data-mode="terrain">Décor</button>
      <button data-mode="objective">Objectif</button>
      <button data-mode="refs">Repères</button>
      <button data-mode="calib">Calibrer</button>
      <button id="armyOpen">Liste</button>
      <button id="checkOpen">Tests</button>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
